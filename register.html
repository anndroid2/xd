<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BikeX – Regisztráció</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0f; }
    .crypto-gradient { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
    .card { background: #12121a; border: 1px solid #1f2937; border-radius: 1rem; padding: 2rem; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    .input-field {
      width: 100%; background: #1f2937; border: 1px solid #374151;
      border-radius: 0.5rem; padding: 0.6rem 0.75rem 0.6rem 2.5rem;
      color: #fff; font-size: 0.875rem; outline: none; transition: border-color 0.2s;
    }
    .input-field::placeholder { color: #6b7280; }
    .input-field:focus { border-color: #3b82f6; }
    .btn-primary {
      width: 100%; background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff; font-weight: 600; padding: 0.65rem; border-radius: 0.5rem;
      border: none; cursor: pointer; font-size: 0.95rem; transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-social {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      border: 1px solid #374151; border-radius: 0.5rem; padding: 0.6rem;
      color: #d1d5db; background: transparent; cursor: pointer;
      font-size: 0.875rem; transition: border-color 0.2s, color 0.2s; width: 100%;
    }
    .btn-social:hover { border-color: #6b7280; color: #fff; }
    .type-btn {
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      border: 1px solid #374151; border-radius: 0.75rem; padding: 1rem 0.75rem;
      color: #9ca3af; background: transparent; cursor: pointer; width: 100%;
      transition: all 0.2s; font-size: 0.875rem;
    }
    .type-btn.active-private { border-color: #3b82f6; background: rgba(59,130,246,0.1); color: #fff; }
    .type-btn.active-seller  { border-color: #8b5cf6; background: rgba(139,92,246,0.1); color: #fff; }
    .error-box {
      color: #f87171; font-size: 0.875rem;
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2);
      border-radius: 0.5rem; padding: 0.5rem 0.75rem; display: none;
    }
    .icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: #6b7280; pointer-events: none; }
    label { color: #d1d5db; font-size: 0.875rem; display: block; margin-bottom: 0.375rem; }
    .field { margin-bottom: 1rem; }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">
<div class="w-full max-w-md">

  <!-- Logo -->
  <div class="flex justify-center mb-8">
    <a href="index.html" style="text-decoration:none;display:flex;align-items:center;gap:0.5rem">
      <div class="crypto-gradient" style="width:2.5rem;height:2.5rem;border-radius:0.75rem;display:flex;align-items:center;justify-content:center">
        <svg style="width:1.5rem;height:1.5rem;color:#fff" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="5.5" cy="17.5" r="2.5"/><circle cx="18.5" cy="17.5" r="2.5"/>
          <path d="M8 17.5h7M5.5 17.5L8 10l4-4h4l2.5 7M8 10h8"/>
        </svg>
      </div>
      <span style="font-size:1.5rem;font-weight:700;background:linear-gradient(90deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">BikeX</span>
    </a>
  </div>

  <div class="card">

    <!-- ══ 1. LÉPÉS: REGISZTRÁCIÓS FORM ══ -->
    <div id="step-form" class="step active">

      <a href="bikex.html" style="display:flex;align-items:center;gap:0.375rem;text-decoration:none;color:#9ca3af;font-size:0.875rem;margin-bottom:1rem">
        <span style="width:1.75rem;height:1.75rem;background:#374151;border-radius:50%;display:flex;align-items:center;justify-content:center">
          <svg style="width:0.875rem;height:0.875rem" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </span>
        Vissza
      </a>

      <div style="text-align:center;margin-bottom:1.5rem">
        <h2 style="color:#fff;font-size:1.5rem;font-weight:700;margin:0 0 0.25rem">Regisztráció</h2>
        <p style="color:#9ca3af;font-size:0.875rem;margin:0">Csatlakozz a BikeX közösséghez!</p>
      </div>

      <!-- Fiók típus -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.5rem">
        <button id="btn-private" class="type-btn active-private" onclick="setType('private')">
          <svg style="width:1.5rem;height:1.5rem;color:#3b82f6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <div style="text-align:center">
            <p style="font-weight:600;margin:0">Magánszemély</p>
            <p style="font-size:0.75rem;color:#6b7280;margin:0">Privát eladó</p>
          </div>
        </button>
        <button id="btn-seller" class="type-btn" onclick="setType('seller')">
          <svg style="width:1.5rem;height:1.5rem" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <div style="text-align:center">
            <p style="font-weight:600;margin:0">Eladó / Cég</p>
            <p style="font-size:0.75rem;color:#6b7280;margin:0">Üzleti fiók</p>
          </div>
        </button>
      </div>

      <!-- Social -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.5rem">
        <button class="btn-social" onclick="alert('Google regisztráció')">
          <svg style="width:1rem;height:1rem" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="btn-social" onclick="alert('Facebook regisztráció')">
          <svg style="width:1rem;height:1rem" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Facebook
        </button>
      </div>

      <!-- Elválasztó -->
      <div style="position:relative;margin-bottom:1.5rem">
        <div style="border-top:1px solid #374151"></div>
        <div style="position:absolute;top:-0.6rem;left:50%;transform:translateX(-50%);background:#12121a;padding:0 0.75rem;font-size:0.75rem;color:#6b7280">vagy e-maillel</div>
      </div>

      <!-- Form -->
      <form id="regForm" onsubmit="handleRegister(event)">

        <!-- Magánszemély mezők -->
        <div id="private-fields">
          <div class="field">
            <label>Keresztnév</label>
            <div style="position:relative">
              <span class="icon"><svg style="width:1rem;height:1rem" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
              <input id="firstName" type="text" placeholder="Pl. János" class="input-field" />
            </div>
          </div>
        </div>

        <!-- Eladó/cég mezők -->
        <div id="seller-fields" style="display:none">
          <div class="field">
            <label>Cégnév / Üzlet neve</label>
            <div style="position:relative">
              <span class="icon"><svg style="width:1rem;height:1rem" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
              <input id="companyName" type="text" placeholder="Pl. BikeShop Kft." class="input-field" style="border-color:#4b5563" />
            </div>
          </div>
          <div class="field">
            <label>Adószám</label>
            <div style="position:relative">
              <span class="icon"><svg style="width:1rem;height:1rem" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg></span>
              <input id="taxNumber" type="text" placeholder="Pl. 12345678-1-42" class="input-field" />
            </div>
          </div>
        </div>

        <!-- E-mail -->
        <div class="field">
          <label>E-mail cím</label>
          <div style="position:relative">
            <span class="icon"><svg style="width:1rem;height:1rem" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg></span>
            <input id="regEmail" type="email" placeholder="pelda@email.com" class="input-field" />
          </div>
        </div>

        <!-- Jelszó -->
        <div class="field">
          <label>Jelszó</label>
          <div style="position:relative">
            <span class="icon"><svg style="width:1rem;height:1rem" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input id="regPassword" type="password" placeholder="Legalább 8 karakter" class="input-field" style="padding-right:2.5rem" />
            <button type="button" onclick="toggleRegPwd()" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);color:#6b7280;background:none;border:none;cursor:pointer">
              <svg style="width:1rem;height:1rem" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div id="regErrorBox" class="error-box" style="margin-bottom:1rem"></div>

        <button type="submit" class="btn-primary">Regisztráció</button>
      </form>

      <p style="text-align:center;font-size:0.875rem;color:#6b7280;margin-top:1.5rem">
        Már van fiókod?
        <a href="login.html" style="color:#3b82f6;font-weight:600;text-decoration:none"> Bejelentkezés</a>
      </p>
    </div>

    <!-- ══ 2. LÉPÉS: E-MAIL MEGERŐSÍTÉS ══ -->
    <div id="step-verify" class="step">

      <button onclick="goBack()" style="display:flex;align-items:center;gap:0.375rem;font-size:0.875rem;color:#9ca3af;background:none;border:none;cursor:pointer;margin-bottom:1rem">
        <span style="width:1.75rem;height:1.75rem;background:#374151;border-radius:50%;display:flex;align-items:center;justify-content:center">
          <svg style="width:0.875rem;height:0.875rem" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </span>
        Vissza
      </button>

      <div style="text-align:center;margin-bottom:1.5rem">
        <div style="width:3.5rem;height:3.5rem;border-radius:50%;background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
          <svg style="width:1.75rem;height:1.75rem;color:#3b82f6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <h2 style="color:#fff;font-size:1.5rem;font-weight:700;margin:0 0 0.25rem">E-mail megerősítés</h2>
        <p style="color:#9ca3af;font-size:0.875rem;margin:0">Elküldtük a megerősítő kódot erre a címre:</p>
        <p id="verifyEmailLabel" style="color:#fff;font-weight:500;font-size:0.875rem;margin:0.25rem 0 0"></p>
      </div>

      <form onsubmit="handleVerify(event)">
        <div class="field">
          <label>Megerősítő kód</label>
          <input id="verifyCode" type="text" inputmode="numeric" placeholder="123456" maxlength="6"
            style="width:100%;background:#1f2937;border:1px solid #374151;border-radius:0.5rem;padding:1rem;color:#fff;font-size:1.5rem;text-align:center;letter-spacing:0.4rem;font-family:monospace;outline:none"
            oninput="this.value=this.value.replace(/\D/g,'')" />
        </div>

        <div id="verifyErrorBox" class="error-box" style="margin-bottom:1rem"></div>

        <button type="submit" class="btn-primary">Megerősítés</button>
      </form>

      <p style="text-align:center;font-size:0.875rem;color:#6b7280;margin-top:1.25rem">
        Nem kaptad meg?
        <button type="button" onclick="alert('Kód újraküldve!')" style="color:#3b82f6;font-weight:600;background:none;border:none;cursor:pointer">Küld újra</button>
      </p>
    </div>

  </div>
</div>

<script>
  let currentType = 'private';

  function setType(type) {
    currentType = type;
    document.getElementById('private-fields').style.display = type === 'private' ? 'block' : 'none';
    document.getElementById('seller-fields').style.display  = type === 'seller'  ? 'block' : 'none';
    document.getElementById('btn-private').className = 'type-btn' + (type === 'private' ? ' active-private' : '');
    document.getElementById('btn-seller').className  = 'type-btn' + (type === 'seller'  ? ' active-seller'  : '');
  }

  function toggleRegPwd() {
    const pwd = document.getElementById('regPassword');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }

  function handleRegister(e) {
    e.preventDefault();
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const name     = currentType === 'private'
      ? document.getElementById('firstName').value.trim()
      : document.getElementById('companyName').value.trim();
    const tax = currentType === 'seller' ? document.getElementById('taxNumber').value.trim() : 'ok';

    if (!name || !email || !password) { showError('regErrorBox','Kérjük, töltsd ki az összes mezőt.'); return; }
    if (currentType === 'seller' && !tax) { showError('regErrorBox','Kérjük, add meg az adószámot.'); return; }
    if (password.length < 8) { showError('regErrorBox','A jelszónak legalább 8 karakter kell legyen.'); return; }

    document.getElementById('regErrorBox').style.display = 'none';
    document.getElementById('verifyEmailLabel').textContent = email;

    // Átváltás a megerősítési lépésre
    document.getElementById('step-form').classList.remove('active');
    document.getElementById('step-verify').classList.add('active');
  }

  function handleVerify(e) {
    e.preventDefault();
    const code = document.getElementById('verifyCode').value;
    if (!code || code.length < 4) { showError('verifyErrorBox','Kérjük, add meg a megerősítő kódot.'); return; }
    document.getElementById('verifyErrorBox').style.display = 'none';
    // IDE JÖN A TÉNYLEGES ELLENŐRZÉS
    alert('Regisztráció sikeres! Kód: ' + code);
    window.location.href = 'index.html';
  }

  function goBack() {
    document.getElementById('step-verify').classList.remove('active');
    document.getElementById('step-form').classList.add('active');
    document.getElementById('verifyCode').value = '';
    document.getElementById('verifyErrorBox').style.display = 'none';
  }
</script>
</body>
</html>
